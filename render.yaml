services:
  - type: web
    name: analizza-bot
    env: python
    pythonVersion: "3.11.0"
    buildCommand: pip install -r requirements.txt && playwright install chromium && playwright install-deps chromium
    startCommand: gunicorn main:app --timeout 120
    envVars:
      - key: ANALIZZA_USUARIO
        value: remove
      - key: ANALIZZA_SENHA
        value: 291185
